name: Daily Dividend

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      send_email:
        description: Send one add/heavy summary email after a successful scan
        required: false
        default: false
        type: boolean
      trade_date:
        description: Optional trade date for manual testing (YYYY-MM-DD); blank uses today's Beijing date
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: dividend-daily
  cancel-in-progress: false

jobs:
  daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check A-share trading day
        id: trading_day
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          REQUESTED_TRADE_DATE: ${{ inputs.trade_date }}
        run: |
          ARGS=()
          if [ -n "$REQUESTED_TRADE_DATE" ]; then ARGS+=(--date "$REQUESTED_TRADE_DATE"); fi
          python -m backend.market.check_trading_day "${ARGS[@]}" --github-output "$GITHUB_OUTPUT"
          TRADE_DATE="$(grep '^trade_date=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)"
          IS_TRADING_DAY="$(grep '^is_trading_day=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)"
          {
            echo "# Daily Dividend"
            echo
            echo "Trade date: $TRADE_DATE"
            echo "Trading day: $([ "$IS_TRADING_DAY" = "true" ] && echo yes || echo no)"
            if [ "$IS_TRADING_DAY" = "false" ]; then
              echo "Status: skipped"
              echo "Reason: non_trading_day"
              echo
              echo "Dividend: skipped"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate daily dividend position report
        if: steps.trading_day.outputs.is_trading_day == 'true'
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          DIVIDEND_SMTP_HOST: ${{ secrets.DIVIDEND_SMTP_HOST }}
          DIVIDEND_SMTP_PORT: ${{ secrets.DIVIDEND_SMTP_PORT }}
          DIVIDEND_SMTP_USERNAME: ${{ secrets.DIVIDEND_SMTP_USERNAME }}
          DIVIDEND_SMTP_PASSWORD: ${{ secrets.DIVIDEND_SMTP_PASSWORD }}
          DIVIDEND_EMAIL_FROM: ${{ secrets.DIVIDEND_EMAIL_FROM }}
          DIVIDEND_EMAIL_TO: ${{ secrets.DIVIDEND_EMAIL_TO }}
          TRADE_DATE: ${{ steps.trading_day.outputs.trade_date }}
        run: |
          echo "trigger=$GITHUB_EVENT_NAME"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            echo "mode=send-email"
            echo "trade_date=$TRADE_DATE"
            python -m backend.dividend.daily_position_report --date "$TRADE_DATE" --send-email
            {
              echo "## Dividend"
              echo "Status: completed"
              echo "Mode: send-email"
              echo "Trade date: $TRADE_DATE"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ARGS=()
          if [ -n "$TRADE_DATE" ]; then
            ARGS=(--date "$TRADE_DATE")
          fi
          if [ "${{ inputs.send_email }}" = "true" ]; then
            echo "mode=send-email"
            python -m backend.dividend.daily_position_report "${ARGS[@]}" --send-email
          else
            echo "mode=dry-run"
            python -m backend.dividend.daily_position_report "${ARGS[@]}" --dry-run
          fi
          {
            echo "## Dividend"
            echo "Status: completed"
            echo "Mode: ${{ inputs.send_email == true && 'send-email' || 'dry-run' }}"
            echo "Trade date: ${TRADE_DATE:-auto}"
          } >> "$GITHUB_STEP_SUMMARY"
