name: Dividend Daily Report

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      send_email:
        description: Send one add/heavy summary email after a successful scan
        required: false
        default: false
        type: boolean
      trade_date:
        description: Optional trade date for manual testing (YYYY-MM-DD); blank uses today's Beijing date
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: dividend-daily-report
  cancel-in-progress: false

jobs:
  daily-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate daily dividend position report
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          DIVIDEND_SMTP_HOST: ${{ secrets.DIVIDEND_SMTP_HOST }}
          DIVIDEND_SMTP_PORT: ${{ secrets.DIVIDEND_SMTP_PORT }}
          DIVIDEND_SMTP_USERNAME: ${{ secrets.DIVIDEND_SMTP_USERNAME }}
          DIVIDEND_SMTP_PASSWORD: ${{ secrets.DIVIDEND_SMTP_PASSWORD }}
          DIVIDEND_EMAIL_FROM: ${{ secrets.DIVIDEND_EMAIL_FROM }}
          DIVIDEND_EMAIL_TO: ${{ secrets.DIVIDEND_EMAIL_TO }}
          TRADE_DATE: ${{ inputs.trade_date }}
        run: |
          echo "trigger=$GITHUB_EVENT_NAME"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            echo "mode=send-email"
            echo "trade_date=auto"
            python -m backend.dividend.daily_position_report --send-email
            exit 0
          fi
          ARGS=()
          if [ -n "$TRADE_DATE" ]; then
            ARGS=(--date "$TRADE_DATE")
          fi
          if [ "${{ inputs.send_email }}" = "true" ]; then
            echo "mode=send-email"
            python -m backend.dividend.daily_position_report "${ARGS[@]}" --send-email
          else
            echo "mode=dry-run"
            python -m backend.dividend.daily_position_report "${ARGS[@]}" --dry-run
          fi
